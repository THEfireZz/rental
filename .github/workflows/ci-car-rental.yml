
name: CI/CD - car-rental-service

# ============================================
# A. Global configuration
# ============================================

permissions:
  contents: read

concurrency:
  group: car-rental-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'

  pull_request:
    branches: [ main, develop ]

# ============================================
# B, C, D. Pipeline
# ============================================

jobs:

  # ============================================
  # B. Java tests
  # ============================================

  test:
    name: Java Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Run tests
        working-directory: apps/car-rental-service
        run: ./gradlew clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: |
            apps/car-rental-service/build/test-results/test/
            apps/car-rental-service/build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # C. Java code quality
  # ============================================

  code-quality:
    name: Java Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Run Checkstyle
        working-directory: apps/car-rental-service
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-checkstyle-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # D. Docker image build
  # ============================================

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/car-rental-service
          push: false
          tags: rental-java:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
